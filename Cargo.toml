[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/sim-core",
    "crates/sim-attractors",
    "crates/sim-discrete",
    "crates/sim-multibody",
    "crates/sim-cfd",
    "crates/sim-chembio",
]

[workspace.dependencies]
glam = "0.29"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
