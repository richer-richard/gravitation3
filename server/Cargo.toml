[package]
name = "gravitation3-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
dotenv = "0.15"
http = "1"

physics-engine = { path = "../crates/physics-engine" }
provider-adapters = { path = "../crates/provider-adapters" }
